name: CI

on:
  push:
    branches: [main, feature/mvp-implementation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # P-38：依赖漏洞门禁（moderate 及以上直接失败）
      - run: pnpm audit --audit-level=moderate

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @auto-reimbursement/web build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
